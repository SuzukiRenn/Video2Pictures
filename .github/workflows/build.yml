name: Build desktop packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, architecture: x64, target: windows-x64 }
          - { runner: macos-15, architecture: arm64, target: macos-arm64 }
          - { runner: macos-15-intel, architecture: x64, target: macos-x64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.6'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - run: >-
          python -m pip install --only-binary=:all: -r requirements-build.txt
      - run: python -m unittest discover -v
      - run: python scripts/package.py
      - run: python -m tests.smoke release/Video2Pictures-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v6
        with:
          name: Video2Pictures-${{ matrix.target }}
          path: release/Video2Pictures-${{ matrix.target }}.zip
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: Video2Pictures-*
          path: release
          merge-multiple: true
      - name: Publish three verified ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=(release/Video2Pictures-{windows-x64,macos-arm64,macos-x64}.zip)
          for asset in "${assets[@]}"; do test -s "$asset"; done
          gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
